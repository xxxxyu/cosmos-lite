name: Manual GPU Validation

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: JSON runner labels for a trusted self-hosted GPU runner
        required: true
        default: '["self-hosted", "gpu", "rtx4090"]'

concurrency:
  group: manual-gpu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quant-unit-tests:
    runs-on: ${{ fromJSON(inputs.runner_label) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: astral-sh/setup-uv@v7
      - name: Install locked policy runtime
        run: CUDA_VISIBLE_DEVICES=0 examples/quantized_robot_policy/setup.sh
      - name: Run quantization unit tests
        run: |
          examples/quantized_robot_policy/.venv/bin/python -m pytest -q \
            cosmos_framework/scripts/action_policy_server_robocasa365_quant_test.py \
            cosmos_framework/scripts/action_policy_server_robolab_test.py \
            cosmos_framework/scripts/export_robolab_train_calibration_requests_test.py \
            cosmos_framework/scripts/robocasa365_quant_pipeline_test.py \
            cosmos_framework/scripts/robolab_quant_bundle_test.py \
            cosmos_framework/scripts/robolab_quant_pipeline_test.py
      - name: Check Marlin runtime
        run: CUDA_VISIBLE_DEVICES=0 examples/quantized_robot_policy/.venv/bin/python examples/quantized_robot_policy/check_runtime.py
